version: '3.8'

services:

  authentication-app:
    image: authentication:latest
    container_name: authentication-app
    depends_on:
      - db-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    networks:
      - app-network

  db-auth:
    image: postgres:15-alpine
    container_name: db-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1005076148
      POSTGRES_DB: createUserPragma
    ports:
      - "5433:5432"
    volumes:
      - db-auth-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  db-auth-data:
