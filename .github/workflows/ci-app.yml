name: CI - Build
on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - bugfix/*
      - hotfix/*
      - feature/*

permissions:
  contents: read
  pull-requests: write

jobs:
  buil-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache dependency Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissions Wrapper
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew build -x test

      - name: Execute test + jacoco
        run: ./gradlew test jacocoTestReport

      - name: Execute pitest
        run: ./gradlew pitest

      - name: Publish report test
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Result post test
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit

      - name: Analisis SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar

      - name: Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}