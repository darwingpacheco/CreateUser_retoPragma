name: CI - Build
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - bugfix/*
      - hotfix/*
      - feature/*

permissions:
  contents: read
  pull-requests: write

jobs:
  buil-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure JDK17 and Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissions Wrapper
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew build -x test

      - name: Execute test + jacoco
        run: ./gradlew test jacocoTestReport

      - name: Execute pitest
        run: ./gradlew pitest

      - name: Publish report test
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Result post test
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit

      - name: Analisis SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner.zip
          ./sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
            -Dsonar.projectKey=darwingpacheco_CreateUser_retoPragma \
            -Dsonar.organization=darwingpacheco \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=**/build/classes/java/main \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Quality Gate SonarQube
        run: |
          TASK_ID=$(grep "ceTaskId=" .scannerwork/report-task.txt | cut -d'=' -f2)
          BRANCH=$(grep "dashboardUrl=" .scannerwork/report-task.txt | python3 -c "
          import sys, urllib.parse
          url = sys.stdin.read().split('dashboardUrl=')[1].strip()
          params = dict(urllib.parse.parse_qs(urllib.parse.urlparse(url).query))
          print(params.get('branch', [''])[0])
          ")
          PROJECT_KEY=$(grep "projectKey=" .scannerwork/report-task.txt | cut -d'=' -f2)
          
          echo "Esperando que SonarCloud procese el análisis..."
          while true; do
            TASK_STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
              "https://sonarcloud.io/api/ce/task?id=$TASK_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['task']['status'])")
            echo "Task status: $TASK_STATUS"
            if [ "$TASK_STATUS" = "SUCCESS" ] || [ "$TASK_STATUS" = "FAILED" ] || [ "$TASK_STATUS" = "CANCELLED" ]; then
              break
            fi
            sleep 3
          done
          
          STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY&branch=$BRANCH" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])")
          echo "Quality Gate: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "❌ Quality Gate failed: $STATUS"
            exit 1
          fi
          echo "✅ Quality Gate passed"