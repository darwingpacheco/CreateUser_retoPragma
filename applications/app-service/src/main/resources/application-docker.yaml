    host: db-auth
    port: 5432
    database: createUserPragma
    schema: public
    username: postgres
    password: 1005076148

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
