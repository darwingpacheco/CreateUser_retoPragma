app:
  ports:
    - "8081:8081"

spring:
  application:
    name: createUserPragma

  r2dbc:
    url: r2dbc:postgresql://db-auth:5432/createUserPragma
    username: postgres
    password: 1005076148

  sql:
    init:
      mode: always
      platform: postgres
      schema-locations: classpath:script/database.sql

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

adapter:
